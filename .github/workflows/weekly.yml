name: KM News Weekly
on:
  schedule: [{cron: "0 0 * * 1"}]   # จันทร์ 07:00 เวลาไทย
  workflow_dispatch:                # กดรันเองได้
  push:
    paths: ["data/new.json"]        # โหมดฟรี: อัปไฟล์ new.json แล้วสร้างหน้าเว็บทันที
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install anthropic
      - run: python fetch.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: |
          git config user.name km-bot && git config user.email km-bot@users.noreply.github.com
          git add -A docs data && git commit -m "digest $(date +%F)" || echo "no change"
          git push
