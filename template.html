button{font:inherit}
.top{background:linear-gradient(100deg,#0c3c49,#14584f)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
.top img{height:48px;width:auto;display:block}
.top .all{margin-left:auto;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font:500 14px Prompt,sans-serif}
.top .all:hover{background:rgba(255,255,255,.12)}
.hero{background:transparent}
.intro{max-width:1320px;margin:0 auto;padding:30px 24px 96px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.intro h1{margin:0;font:700 clamp(26px,3.2vw,38px)/1.15 Prompt,sans-serif;color:var(--teal)}
.intro p{margin:6px 0 0;color:var(--soft)}
.upd{font-size:13px;color:var(--soft)}
.wrap{max-width:1320px;margin:-76px auto 0;position:relative;padding:0 24px;display:grid;gap:20px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--panel);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px -18px rgba(15,76,92,.45);height:500px}
[data-p=WORLD]{--c:var(--wA);--cbg:var(--wbg);--gA:var(--wA);--gB:var(--wB)}
[data-p=FUTURE]{--c:var(--fB);--cbg:var(--fbg);--gA:var(--fA);--gB:var(--fB)}
[data-p=HACK]{--c:var(--hA);--cbg:var(--hbg);--gA:var(--hA);--gB:var(--hB)}
.panel[data-p=HACK]{height:450px}
.ph{background:linear-gradient(120deg,var(--gA),var(--gB));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}
.ph h2{margin:0;flex:1;font:600 20px/1.25 Prompt,sans-serif}
.ph small{display:block;font:400 13px Sarabun,sans-serif;opacity:.88}
.count{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.nav{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:var(--gA);font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center}
.seeall{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font:500 13px Prompt,sans-serif;cursor:pointer;white-space:nowrap}
.seeall:hover{background:rgba(255,255,255,.15)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--c)}
.bar i.run{animation:fill var(--dur) linear forwards}
.hold .bar i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.track{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:start;padding:18px 26px 10px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}
.card h3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;flex:none}
.card .so{flex:none}
.sot{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card .foot .more{line-height:1.7;align-self:center}
.card .tags,.card .more,.card .foot{flex:none}
.card h3{margin:0;font:600 20px/1.45 Prompt,sans-serif}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:0;background:var(--cbg);color:var(--c);font:500 12.5px Prompt,sans-serif;padding:2px 10px;border-radius:999px;cursor:pointer}
.tag:hover{filter:brightness(.95);text-decoration:underline}
.sum{margin:0;flex:none;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clamp,6);overflow:hidden;max-width:46em}
[data-p=HACK] .sum{--clamp:4}
.more{align-self:flex-start;border:0;background:transparent;color:var(--c);font:600 14px Prompt,sans-serif;padding:0;cursor:pointer}
.more[hidden]{display:none}
.so{margin:0;padding:10px 14px;border-radius:12px;background:var(--cbg);font-size:14.5px}
.so b{color:var(--c);font:600 14.5px Prompt,sans-serif;margin-right:6px}
.foot{margin-top:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:4px;font-size:13.5px;color:var(--soft)}
.foot a{color:var(--c);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}
.like{margin-left:auto;min-height:32px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:4px 13px;cursor:pointer}
.like svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.like.on{color:var(--heart);border-color:var(--heart)}
.like.on svg{fill:var(--heart)}
.like.pop svg{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 12px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dots button.on{background:var(--c);width:22px;border-radius:4px}
.empty{margin:auto;padding:40px;color:var(--soft);text-align:center}
/* dialogs */
dialog{border:0;border-radius:20px;padding:0;background:var(--panel);color:var(--ink);box-shadow:0 30px 80px -20px rgba(10,40,60,.5);width:min(640px,calc(100vw - 28px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(14,40,58,.45);backdrop-filter:blur(3px)}
dialog[open]{animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.dh{background:linear-gradient(120deg,var(--gA,#0f4c5c),var(--gB,#14584f));color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;z-index:1}
.dh h3{margin:0;flex:1;font:600 18px/1.45 Prompt,sans-serif}
.x{border:0;background:rgba(255,255,255,.22);color:#fff;width:32px;height:32px;border-radius:50%;font-size:17px;cursor:pointer;flex:none}
.db{padding:18px 22px 22px;display:grid;gap:12px}
.db p{margin:0}
.btn{justify-self:start;background:var(--c,#0f4c5c);color:#fff;text-decoration:none;font:600 14px Prompt,sans-serif;padding:8px 18px;border-radius:999px}
#arc{width:min(1100px,calc(100vw - 28px));height:calc(100vh - 40px)}
#arc[open]{display:flex;flex-direction:column}
.af{padding:14px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;font:500 13.5px Prompt,sans-serif}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.af input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--bg);color:var(--ink);width:100%}
.chip-on{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--soft)}
.chip-on button{border:0;background:var(--teal);color:#fff;border-radius:999px;padding:2px 10px;cursor:pointer}
.alist{flex:1;overflow-y:auto;padding:16px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
.ai{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c)}
.ai h4{margin:0;font:600 15.5px/1.45 Prompt,sans-serif}
.ai p{margin:0;font-size:14px;color:var(--soft);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.ai .foot{font-size:12.5px;align-items:center}
.ai .like{padding:2px 10px;min-height:28px}
.ai .open{border:0;background:transparent;color:var(--c);font:600 13px Prompt,sans-serif;padding:0;cursor:pointer}
.acount{font-size:13px;color:var(--soft)}

/* layout: no inner scroll */
.panel{height:520px}
.card{padding:18px 24px 12px;gap:10px;overflow:hidden}
.card h3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;flex:none}
.card .tags{flex:none}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:18px;overflow:hidden}
.card.two .body{grid-template-columns:1.15fr 1fr}
.colL,.colR{min-height:0;overflow:hidden}
.colR{border-left:2px solid var(--cbg);padding-left:16px}
.colR h4{margin:0 0 6px;font:600 14px Prompt,sans-serif;color:var(--c)}
.kt{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;line-height:1.55}
.kt li::marker{color:var(--c)}
.card .sum{-webkit-line-clamp:var(--clamp,6);max-width:none}
.card .so{flex:none}
.sot{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card .foot .more{line-height:1.7;align-self:center}
.card .foot{flex:none;margin-top:0}
.db h4{margin:4px 0 0;font:600 15px Prompt,sans-serif;color:var(--c)}
.db ul{margin:0;padding-left:20px;display:grid;gap:6px}
@media (max-width:860px){.panel{height:auto}.card.two .body{grid-template-columns:1fr}.colR{border-left:0;padding-left:0;border-top:2px solid var(--cbg);padding-top:10px}.track{align-items:stretch}.card{min-height:560px}}
.arow{display:flex;gap:8px}.arow input{flex:1}
#asort{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--bg);color:var(--ink);cursor:pointer}

/* key-visual cards */
.card{flex-direction:row;padding:0;gap:0}
.vis{flex:0 0 36%;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--gA),var(--gB));color:#fff;display:flex;flex-direction:column;justify-content:center;padding:22px 24px;gap:6px}
.vis::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.vis::after{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.vis .ico{font-size:40px;line-height:1;position:relative;z-index:1}
.vis .big{font:700 clamp(40px,4.4vw,60px)/1 Prompt,sans-serif;letter-spacing:-.02em;position:relative;z-index:1}
.vis .lbl{font:500 14.5px/1.45 Prompt,sans-serif;opacity:.92;position:relative;z-index:1;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.vis.noStat .ico{font-size:72px}
.vis .src{position:absolute;left:24px;bottom:16px;font-size:12px;opacity:.8;z-index:1}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:20px 24px 14px}
.card.two .body{grid-template-columns:1fr}
.colR{border:0;padding:0}
.kt{list-style:none;padding:0;gap:8px}
.kt li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.kt li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:var(--cbg);color:var(--c);font:700 12px/20px Prompt,sans-serif;text-align:center;margin-top:2px}
.kt li span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
.trystep{background:var(--cbg);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.trystep .n{flex:none;font-size:26px;line-height:1}
.trystep b{display:block;font:600 13px Prompt,sans-serif;color:var(--c);margin-bottom:2px}
.trystep p{margin:0;font-size:15px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card .foot .src2{display:none}
@media (max-width:860px){.card{flex-direction:column;min-height:0}.vis{flex:none;min-height:150px}.vis .src{display:none}.panel{height:auto}}
.sum[hidden]{display:none!important}
.panel[data-p=HACK]{height:400px}

/* ===== v3 layout: ซ้าย=ภาพ+หัวข้อ+ปุ่ม / ขวาบน=takeaways / ขวาล่าง=สรุป ===== */
.panel{height:540px}.panel[data-p=HACK]{height:500px}
.card.v3{display:grid;grid-template-columns:42% 58%;padding:0;gap:0;overflow:hidden;flex-direction:initial}
.v3 .L{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
.v3 .media{flex:0 0 46%;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--gA),var(--gB));color:#fff}
.v3 .media img{width:100%;height:100%;object-fit:cover;display:block}
.v3 .media .fb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:14px 20px;gap:2px}
.v3 .media .fb .ico{font-size:34px;line-height:1}
.v3 .media .fb .big{font:700 44px/1 Prompt,sans-serif;letter-spacing:-.02em}
.v3 .media .fb .lbl{font:500 13.5px/1.4 Prompt,sans-serif;opacity:.92;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.v3 .media .fb.noStat .ico{font-size:64px}
.v3 .chip{position:absolute;left:12px;bottom:12px;background:rgba(10,30,45,.72);backdrop-filter:blur(4px);color:#fff;border-radius:10px;padding:4px 10px;font:600 13px Prompt,sans-serif;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3 .chip b{font-size:16px;margin-right:6px}
.v3 .Lt{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:14px 18px 12px}
.v3 h3{margin:0;font:600 18px/1.45 Prompt,sans-serif;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--tl,3);overflow:hidden;flex:none}
.v3 .tags{flex:none}
.v3 .foot{flex:none;margin-top:auto;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;font-size:13px;color:var(--soft)}
.v3 .foot .d{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3 .foot a{white-space:nowrap;flex:none}
.v3 .foot .like{margin-left:0;flex:none}
.v3 .R{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:16px 20px 14px;gap:12px}
.v3 .ktb{flex:0 1 auto;max-height:58%;min-height:0;overflow:hidden}
.v3 .R h4{margin:0 0 6px;font:600 14px Prompt,sans-serif;color:var(--c)}
.v3 .kt{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.v3 .kt li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.v3 .kt li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:var(--cbg);color:var(--c);font:700 12px/20px Prompt,sans-serif;text-align:center;margin-top:2px}
.v3 .kt li[hidden]{display:none}
.v3 .smb{flex:1 1 0;min-height:0;overflow:hidden;border-top:1px dashed var(--line);padding-top:10px}
.v3 .smb .sum{margin:0;font-size:14.5px;color:var(--soft);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clamp,4);overflow:hidden}
.v3 .more{border:0;background:transparent;color:var(--c);font:600 13.5px Prompt,sans-serif;padding:0;cursor:pointer}
.dimg{width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block}
@media (max-width:860px){.panel,.panel[data-p=HACK]{height:auto}.card.v3{grid-template-columns:1fr}.v3 .L{border-right:0}.v3 .media{flex:none;height:180px}.v3 .ktb{max-height:none}.v3 .smb{flex:none}.v3 .smb .sum{--clamp:4!important}}

/* ===== v4 left: แถบสีเต็มความสูง ไอคอน+ตัวเลข+หัวข้อ ===== */
.v3 .L.band{position:relative;border-right:0;color:#fff;background:linear-gradient(160deg,var(--gA),var(--gB));isolation:isolate}
.v3 .L.band .bg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;opacity:.28;mix-blend-mode:luminosity}
.v3 .L.band::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);z-index:-1}
.v3 .L.band::after{content:"";position:absolute;left:-50px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);z-index:-1}
.v3 .band .Lt{padding:22px 22px 14px;gap:10px}
.v3 .band .ico{font-size:40px;line-height:1;flex:none}
.v3 .band .stat{flex:none;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.v3 .band .stat b{font:700 34px/1 Prompt,sans-serif;letter-spacing:-.02em}
.v3 .band .stat span{font:500 13px/1.35 Prompt,sans-serif;opacity:.9}
.v3 .band h3{color:#fff;font-size:19px;line-height:1.45;--tl:5}
.v3 .band .tag{background:rgba(255,255,255,.18);color:#fff}
.v3 .band .foot{color:rgba(255,255,255,.85)}
.v3 .band .foot a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.v3 .band .like{border-color:rgba(255,255,255,.5);color:#fff}
.v3 .band .like.on{background:#fff;border-color:#fff}
@media (max-width:860px){.v3 .band h3{--tl:4}}

/* ===== แถบซ้ายสีเต็มความสูง ===== */
.v3 .L.band{position:relative;background:linear-gradient(160deg,var(--gA),var(--gB));color:#fff;border-right:0;overflow:hidden}
.v3 .L.band::before{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.08)}
.v3 .L.band::after{content:"";position:absolute;left:-50px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.v3 .band .Lt{position:relative;z-index:1;padding:22px 22px 16px;gap:12px}
.v3 .bh{display:flex;align-items:center;gap:12px;flex:none}
.v3 .bh .ico{font-size:44px;line-height:1}
.v3 .bh .stat{display:flex;flex-direction:column;font:500 12.5px/1.35 Prompt,sans-serif;opacity:.95;min-width:0}
.v3 .bh .stat{overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.v3 .bh .stat b{display:block;font:700 30px/1.05 Prompt,sans-serif;letter-spacing:-.01em}
.v3 .band h3{color:#fff;font:600 20px/1.45 Prompt,sans-serif;--tl:5}
.v3 .band .tag{background:rgba(255,255,255,.18);color:#fff}
.v3 .band .foot{color:rgba(255,255,255,.85)}
.v3 .band .foot a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.v3 .band .like{border-color:rgba(255,255,255,.5);color:#fff}
.v3 .band .like.on{color:#fff;border-color:#fff;background:rgba(255,255,255,.18)}
.v3 .band .like.on svg{fill:#ff5c8a;stroke:#ff5c8a}
.v3 .band :focus-visible{outline-color:#fff}
@media (max-width:860px){.v3 .band h3{--tl:4}}
.v3 .band h3.bt{font:600 21px/1.5 Prompt,sans-serif;--tl:6}
.v3 .bt .ti{display:inline-block;font-size:1.5em;line-height:1;vertical-align:-.12em;margin-right:8px}
.v3 .bt .num{font:700 1.9em/1 Prompt,sans-serif;letter-spacing:-.02em;vertical-align:-.08em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.15)}
.v3 .band{background-size:cover;background-position:center}
.v3 .band.hasimg::before,.v3 .band.hasimg::after{display:none}
.v3 .band.hasimg h3,.v3 .band.hasimg .foot{text-shadow:0 1px 8px rgba(0,0,0,.35)}
.v3 .tbox{flex:0 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:14px;padding:14px 16px}
.v3 .band .tag{background:rgba(255,255,255,.2)}
.ecos{display:flex;gap:6px;flex-wrap:wrap}
.eco{border:1px solid currentColor;background:transparent;color:var(--c);border-radius:999px;padding:1px 10px;font:500 12px Prompt,sans-serif;cursor:pointer;white-space:nowrap}
.band .eco{color:#fff;border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.12)}
.eco:hover{text-decoration:underline}
#aeco button{font-size:12.5px;padding:4px 12px}
</style>

<script>
const DATA=/*__DATA__*/null;
const SB={url:"__SUPABASE_URL__",key:"__SUPABASE_ANON_KEY__"};
const AUTO=8000,LIMIT={WORLD:8,FUTURE:8,HACK:5};
const NAME={ALL:"ทั้งหมด",WORLD:"🌎 KM Around the World",FUTURE:"🤖 Future of KM",HACK:"💡 Work-hack Tips"};
const shared=SB.url.startsWith("http"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ITEMS=DATA?.items||[];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const mine=store.get("km-liked")||{};let counts={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const heart='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.1 3.2 4 7 4c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.8 0 6.1 4.1 4.6 7.7C19.5 16.4 12 21 12 21z"/></svg>';
const label=p=>p==="HACK"?"ลองทำ":"ต่อยอด";
const byId=Object.fromEntries(ITEMS.map(i=>[i.uid,i]));
const tagsH=n=>`<div class="tags">${(n.tags||[]).map(t=>`<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>`;
const likeH=n=>`<button class="like${mine[n.uid]?" on":""}" data-uid="${esc(n.uid)}" aria-pressed="${!!mine[n.uid]}" aria-label="ถูกใจ">${heart}${shared?`<span>${counts[n.uid]??0}</span>`:""}</button>`;
const srcH=n=>`<span>${esc(n.src)}${n.date?" ("+esc(n.date)+")":""}</span>`;
async function sb(path,body){const r=await fetch(SB.url+"/rest/v1/"+path,{method:body?"POST":"GET",headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json"},body:body&&JSON.stringify(body)});if(!r.ok)throw 0;return r.json()}

// หน้าแรก = สัปดาห์ล่าสุดของแต่ละหมวด
function latest(p){
  // หน้าแรก: ชุดล่าสุดของหมวดนี้ (ถ้าสัปดาห์นี้ไม่มี = ใช้ชุดสัปดาห์ก่อน) และมีอย่างน้อย 2 เรื่อง
  const l=ITEMS.filter(i=>i.pillar===p).sort((a,b)=>(b.week||"").localeCompare(a.week||""));if(!l.length)return[];
  const w=l[0].week,cur=l.filter(i=>i.week===w).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,LIMIT[p]);
  const old=l.filter(i=>i.week!==w);
  while(cur.length<2&&old.length)cur.push(old.shift());
  return cur}

// ให้ทุกกล่องพอดี ไม่ต้องเลื่อน: ลดจำนวนบรรทัดสรุปจนปุ่มล่างสุดมองเห็น
const ICON={"#Meeting":"🗓️","#Leadership":"🧭","#Collaboration":"🤝","#Focus":"🎯","#Wellbeing":"🌿","#AI-at-Work":"🤖","#Automation":"⚙️","#Prompting":"💬","#Decision":"⚖️","#Writing":"✍️","#Learning":"📚","#DataSkills":"📈","#Benchmark":"📊","#KM-Strategy":"🧩","#Lessons-Learned":"🔁","#CoP":"👥","#Knowledge-Transfer":"🔄","#Mentoring":"🧑‍🏫","#Storytelling":"📖","#Innovation":"💡","#Capture":"📥","#Curate":"🗂️","#Apply":"🛠️","#Renew":"♻️","#Business-Impact":"📈","#Learning-Culture":"🌱","#Engagement":"🙌","#KnowledgeGraph":"🕸️","#RAG":"🔎","#AI-Agent":"🦾","#Digital-Expert":"🧠"};
const titleH=s=>esc(s).replace(/(\d[\d,.]*\s?%?)/g,m=>/^(19|20)\d{2}$/.test(m.trim())?m:`<span class="num">${m}</span>`);
const ECO={CAP:"📈 Capability Development",SYS:"🔄 Knowledge System",ACT:"🚀 Knowledge in Action",DIG:"🤖 KM AI & Digital",CUL:"🌱 Learning Culture"};
const ecoH=n=>(n.eco||[]).filter(e=>ECO[e]).map(e=>`<button class="eco" data-eco="${e}">${ECO[e]}</button>`).join("");
const ico=n=>n.icon||ICON[(n.tags||[])[0]]||({WORLD:"🌎",FUTURE:"🚀",HACK:"💡"}[n.pillar]);
function fit(c){
  if(!c.classList.contains("v3"))return;
  const mob=matchMedia("(max-width:860px)").matches;
  const L=c.querySelector(".Lt"),h=c.querySelector("h3");let tl=6;h.style.setProperty("--tl",tl);
  const tb=c.querySelector(".tbox");while(!mob&&tl>1&&(L.scrollHeight>L.clientHeight+1||(tb&&tb.scrollHeight>tb.clientHeight+1)))h.style.setProperty("--tl",--tl);
  const K=c.querySelector(".ktb");
  if(K&&!mob){const li=[...K.querySelectorAll("li")];li.forEach(x=>x.hidden=false);let k=li.length;while(k>1&&K.scrollHeight>K.clientHeight+1)li[--k].hidden=true}
  const S=c.querySelector(".smb"),s=S.querySelector(".sum");
  if(!mob){const lh=parseFloat(getComputedStyle(s).lineHeight)||24,hh=S.querySelector("h4").offsetHeight+16;s.style.setProperty("--clamp",Math.max(1,Math.floor((S.clientHeight-hh)/lh)))}
}

function render(){
  document.getElementById("upd").textContent=DATA?"อัปเดต "+DATA.updated:"";
  document.querySelectorAll(".panel").forEach(p=>{
    const list=latest(p.dataset.p),track=p.querySelector(".track"),dots=p.querySelector(".dots"),bar=p.querySelector(".bar i");
    if(!list.length){track.innerHTML='<p class="empty">สัปดาห์นี้ยังไม่มีเรื่องที่ผ่านเกณฑ์ รอบหน้าจะอัปเดตให้อัตโนมัติ</p>';p.querySelectorAll(".nav").forEach(b=>b.disabled=true);return}
    track.innerHTML=list.map(n=>{const kt=(n.takeaways||[]).slice(0,5),st=n.stat;
      return `<article class="card v3">
      <div class="L band"${n.image?` data-img="${esc(n.image)}"`:""}><div class="Lt">
        <div class="tbox">${(n.eco||[]).length?`<div class="ecos">${ecoH(n)}</div>`:""}<h3 class="bt"><span class="ti">${ico(n)}</span>${titleH(n.title_th)}</h3>${tagsH(n)}</div>
        <div class="foot"><span class="d">${esc(n.src)}</span><a href="${esc(n.link)}" target="_blank" rel="noopener">อ่านข่าวเต็ม</a>${likeH(n)}</div></div></div>
      <div class="R">${kt.length?`<div class="ktb"><h4>Key takeaways</h4><ul class="kt">${kt.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`:""}
        <div class="smb"><h4>สรุปเนื้อหา</h4><p class="sum">${esc(n.summary_th)}</p></div>
        <button class="more" data-uid="${esc(n.uid)}">See more</button></div></article>`}).join("");
    track.querySelectorAll(".card").forEach(fit);
    track.querySelectorAll(".band[data-img]").forEach(bd=>{const im=new Image();im.referrerPolicy="no-referrer";im.onload=()=>{const cs=getComputedStyle(bd);bd.style.backgroundImage=`linear-gradient(165deg,color-mix(in srgb,${cs.getPropertyValue("--gA")} 90%,transparent) 0%,color-mix(in srgb,${cs.getPropertyValue("--gA")} 45%,transparent) 50%,color-mix(in srgb,${cs.getPropertyValue("--gB")} 55%,transparent) 100%),url("${im.src}")`;bd.style.backgroundSize="cover";bd.style.backgroundPosition="center";bd.style.backgroundRepeat="no-repeat";bd.classList.add("hasimg")};im.src=bd.dataset.img});
    dots.innerHTML=list.map((_,i)=>`<button aria-label="เรื่องที่ ${i+1}"></button>`).join("");
    const cnt=p.querySelector(".count"),idx=()=>Math.round(track.scrollLeft/track.clientWidth);
    const go=i=>track.scrollTo({left:((i+list.length)%list.length)*track.clientWidth});
    let last=-1;
    const restart=()=>{bar.classList.remove("run");void bar.offsetWidth;if(!reduce&&list.length>1){bar.style.setProperty("--dur",AUTO+"ms");bar.classList.add("run")}};
    const sync=()=>{const i=idx();cnt.textContent=`${i+1} / ${list.length}`;[...dots.children].forEach((d,j)=>d.classList.toggle("on",j===i));if(i!==last){last=i;restart()}};
    p.querySelector(".prev").onclick=()=>go(idx()-1);p.querySelector(".next").onclick=()=>go(idx()+1);
    [...dots.children].forEach((d,i)=>d.onclick=()=>go(i));
    track.onscroll=()=>requestAnimationFrame(sync);
    p.onkeydown=e=>{if(e.key==="ArrowRight")go(idx()+1);if(e.key==="ArrowLeft")go(idx()-1)};
    const hold=v=>p.classList.toggle("hold",v);
    p.onmouseenter=()=>hold(true);p.onmouseleave=()=>hold(false);p.onfocusin=()=>hold(true);p.onfocusout=()=>hold(false);
    p.ontouchstart=()=>{hold(true);clearTimeout(p._t);p._t=setTimeout(()=>hold(false),8000)};
    bar.onanimationend=()=>{if(!p.classList.contains("hold")&&!document.querySelector("dialog[open]"))go(idx()+1);else restart()};
    sync();
  });
}

// popup อ่านเต็ม
const dlg=document.getElementById("dlg");
function openItem(n){
  dlg.dataset.p=n.pillar;
  document.getElementById("dt").textContent=n.title_th;
  document.getElementById("dbody").innerHTML=`${n.image?`<img class="dimg" src="${esc(n.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}${tagsH(n)}${(n.takeaways||[]).length?`<h4>Key takeaways</h4><ul>${n.takeaways.slice(0,5).map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`:""}<h4>สรุปเนื้อหา</h4><p>${esc(n.summary_th)}</p><div class="foot">${srcH(n)}${likeH(n)}</div><a class="btn" href="${esc(n.link)}" target="_blank" rel="noopener">อ่านข่าวเต็ม</a>`;
  dlg.open||dlg.showModal();
}

// คลัง
const arc=document.getElementById("arc");let F={p:"ALL",tag:null,q:"",sort:"new",eco:null};
function renderArc(){
  document.getElementById("atabs").innerHTML=Object.keys(NAME).map(k=>`<button data-tab="${k}" class="${F.p===k?"on":""}">${NAME[k]}</button>`).join("");
  document.getElementById("aeco").innerHTML=`<button data-ecof="" class="${F.eco?"":"on"}">ทุก Ecosystem</button>`+Object.entries(ECO).map(([k,v])=>`<button data-ecof="${k}" class="${F.eco===k?"on":""}">${v}</button>`).join("");
  const at=document.getElementById("atag");at.hidden=!F.tag;at.innerHTML=F.tag?`แสดงเฉพาะ <button data-clear>${esc(F.tag)} ✕</button>`:"";
  const q=F.q.toLowerCase();
  const l=ITEMS.filter(i=>(F.p==="ALL"||i.pillar===F.p)&&(!F.tag||(i.tags||[]).includes(F.tag))&&(!F.eco||(i.eco||[]).includes(F.eco))&&(!q||(i.title_th+i.summary_th+(i.tags||[]).join(" ")).toLowerCase().includes(q)));
  const dk=i=>i.date||i.week||"",lk=i=>shared?(counts[i.uid]||0):(mine[i.uid]?1:0);
  l.sort(F.sort==="old"?(a,b)=>dk(a).localeCompare(dk(b)):F.sort==="like"?(a,b)=>lk(b)-lk(a)||dk(b).localeCompare(dk(a)):(a,b)=>dk(b).localeCompare(dk(a)));
  document.getElementById("acount").textContent=`${l.length} เรื่อง`;
  document.getElementById("alist").innerHTML=l.length?l.map(n=>`<article class="ai" data-p="${n.pillar}">${(n.eco||[]).length?`<div class="ecos">${ecoH(n)}</div>`:""}<h4>${esc(n.title_th)}</h4>${tagsH(n)}<p>${esc(n.summary_th)}</p><div class="foot"><span>${esc(n.date||n.week)}</span><button class="open" data-uid="${esc(n.uid)}">อ่านสรุป</button><a href="${esc(n.link)}" target="_blank" rel="noopener">อ่านข่าวเต็ม</a>${likeH(n)}</div></article>`).join(""):'<p class="empty">ไม่พบเรื่องที่ตรงกับตัวกรองนี้ ลองเลือกหมวดอื่นหรือล้างแท็ก</p>';
}
function openArc(p="ALL",tag=null,eco=null){F={p,tag,eco,q:"",sort:F.sort||"new"};document.getElementById("asort").value=F.sort;document.getElementById("aq").value="";renderArc();arc.open||arc.showModal()}
document.getElementById("aq").oninput=e=>{F.q=e.target.value;renderArc()};
document.getElementById("asort").onchange=e=>{F.sort=e.target.value;renderArc()};

document.addEventListener("click",async e=>{
  const t=e.target;
  const o=t.closest("[data-open]");if(o)return openArc(o.dataset.open);
  const tg=t.closest(".tag");if(tg){dlg.open&&dlg.close();return openArc("ALL",tg.dataset.tag)}
  const ef=t.closest("[data-ecof]");if(ef){F.eco=ef.dataset.ecof||null;return renderArc()}
  const ec=t.closest(".eco");if(ec){dlg.open&&dlg.close();return openArc("ALL",null,ec.dataset.eco)}
  const tab=t.closest("[data-tab]");if(tab){F.p=tab.dataset.tab;return renderArc()}
  if(t.closest("[data-clear]")){F.tag=null;return renderArc()}
  const m=t.closest(".more,.open");if(m)return openItem(byId[m.dataset.uid]);
  if(t.closest(".x")){t.closest("dialog").close();return}
  if(t===dlg||t===arc){t.close();return}
  const b=t.closest(".like");if(!b)return;
  const uid=b.dataset.uid,on=!mine[uid];on?mine[uid]=1:delete mine[uid];store.set("km-liked",mine);
  document.querySelectorAll(`.like[data-uid="${CSS.escape(uid)}"]`).forEach(x=>{x.classList.toggle("on",on);x.setAttribute("aria-pressed",on);const s=x.querySelector("span");if(s)s.textContent=Math.max(+s.textContent+(on?1:-1),0)});
  b.classList.remove("pop");void b.offsetWidth;if(on)b.classList.add("pop");
  if(shared){try{const n=await sb("rpc/like_news",{p_uid:uid,p_delta:on?1:-1,p_title:(byId[uid]||{}).title_th||null});counts[uid]=n;document.querySelectorAll(`.like[data-uid="${CSS.escape(uid)}"] span`).forEach(s=>s.textContent=n)}catch{}}
});
document.addEventListener("visibilitychange",()=>document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("hold",document.hidden)));
addEventListener("resize",()=>document.querySelectorAll(".card").forEach(fit));
document.fonts&&document.fonts.ready.then(()=>document.querySelectorAll(".card").forEach(fit));

render();
if(shared&&ITEMS.length){sb(`likes?select=uid,n&uid=in.(${ITEMS.slice(0,300).map(n=>n.uid).join(",")})`).then(r=>{r.forEach(x=>counts[x.uid]=x.n);render();if(arc.open)renderArc()}).catch(()=>{})}
</script>
